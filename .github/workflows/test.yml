name: Test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: omniguardian
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: omniguardian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omniguardian"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://omniguardian:test-only@localhost:5432/omniguardian
      TEST_DATABASE_URL: postgresql+asyncpg://omniguardian:test-only@localhost:5432/omniguardian
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e '.[test]'
      - run: python -m ruff check app scripts tests
      - run: python -m scripts.migrate
      - run: python -m pytest -q
      - run: docker compose config --quiet
